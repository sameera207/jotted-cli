[project]
name = "jotted"
version = "0.1.3"
description = "Turn handwritten notes into a to-do list"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rmscene>=0.7",
    "rich>=13",
    "anthropic>=1.9.0",
    "typesafe-sdk>=0.7.2",
    "pillow>=12.3.0",
    "reportlab>=5.0.1",
    "flask>=3.1.3",
    "waitress>=3.0.2",
    "truststore>=0.10",
    "certifi>=2024.2",
]

[project.scripts]
jotted = "jotted.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jotted"]
exclude = ["src/jotted/mcp_ui/dev"]  # the widget's fake host, for development only

[tool.pytest.ini_options]
testpaths = ["tests"]
