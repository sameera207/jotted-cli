# Tests, including that the contract documents match the CLI, on every push to main and every
# pull request. Releases are release.yml.
name: contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Contract documents are up to date
        run: uv run python scripts/contract_docs.py --check
      - run: uv run pytest -q
