# The standalone `jotted` (Python inside) for each macOS architecture, built and smoke-tested by
# scripts/build_standalone.py. On a release tag it is attached to the GitHub release, beside the
# contract documents (contract.yml), for apps to pin (jotted-app/docs/bundling.md). Run by hand
# (workflow_dispatch) it only builds, and keeps the result as a workflow artifact.
name: standalone

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # attaching files to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple silicon: jotted-X.Y.Z-macos-arm64
          - runner: macos-15-intel  # Intel: jotted-X.Y.Z-macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag is the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1; }
      - name: Build and smoke-test
        run: uv run --python 3.11 --with pyinstaller python scripts/build_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: jotted-${{ matrix.runner }}
          path: build/release/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" build/release/*.tar.gz build/release/*.sha256 --clobber
